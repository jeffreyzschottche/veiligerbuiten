; Eén container, vier processen: PHP-FPM en nginx voor de API, de scheduler (ophaalplanner,
; opruimen, meldingen) en de queue-worker (pushberichten). Supervisor herstart ze als ze stoppen.
; Uitzetten per container met RUN_SCHEDULER=false of RUN_QUEUE=false (bijvoorbeeld bij
; meerdere webcontainers: de scheduler hoort er maar in één te draaien).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
