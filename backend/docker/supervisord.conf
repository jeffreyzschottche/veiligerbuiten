; Eén container, drie processen: de API, de scheduler (ophaalplanner, opruimen, meldingen)
; en de queue-worker (pushberichten). Supervisor start ze en herstart ze als ze stoppen.
; Uitzetten per container met RUN_SCHEDULER=false of RUN_QUEUE=false (bijvoorbeeld bij
; meerdere webcontainers: de scheduler hoort er maar in één te draaien).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=php artisan serve --host=0.0.0.0 --port=8000
; Meerdere PHP-workers, zodat één trage aanvraag de rest niet ophoudt.
environment=PHP_CLI_SERVER_WORKERS="%(ENV_WEB_WORKERS)s"
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php artisan schedule:work
directory=/app
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/app
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
