name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: veiligbuiten, POSTGRES_USER: veiligbuiten, POSTGRES_PASSWORD: secret }
        ports: ['5432:5432']
        options: >- --health-cmd "pg_isready -U veiligbuiten" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_pgsql, redis }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: cp .env.example .env && php artisan key:generate
        working-directory: backend
      - run: php artisan test
        working-directory: backend
        env: { DB_CONNECTION: pgsql, DB_HOST: 127.0.0.1, DB_DATABASE: veiligbuiten, DB_USERNAME: veiligbuiten, DB_PASSWORD: secret, REDIS_HOST: 127.0.0.1 }
      - run: npm ci && npm run build
        working-directory: frontend
